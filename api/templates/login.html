<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiskChain AI | Secure Terminal Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: 'Inter', sans-serif; 
    min-height: 100vh; 
    background-color: #020617; /* deep slate */
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
    color: #fff;
    background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(0, 119, 255, 0.08), transparent 25%);
}

/* Moving Grid Background */
.cyber-grid {
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
    animation: gridMove 20s linear infinite;
    z-index: 0;
}
@keyframes gridMove {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
}

.auth-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    padding: 3rem;
    background: rgba(10, 15, 30, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 243, 255, 0.15);
    border-top: 4px solid #00f3ff;
    border-radius: 16px;
    box-shadow: 0 0 50px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
}

.logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 1rem;
}
.logo-icon {
    width: 50px;
    height: 50px;
    background: rgba(0, 243, 255, 0.1);
    border: 2px solid #00f3ff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    animation: pulse 2s infinite alternate;
}
.logo-icon svg {
    color: #00f3ff;
    width: 28px;
    height: 28px;
}
@keyframes pulse {
    0% { box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
    100% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.6); }
}
.logo-text {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -1px;
    text-transform: uppercase;
}
.logo-text span {
    color: #00f3ff;
}

.subtitle {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #888;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
}

.tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 2.5rem;
    border: 1px solid rgba(255, 255, 255, 0.05);
}
.tab {
    flex: 1;
    padding: 0.75rem;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s;
    border: none;
    background: transparent;
    color: #666;
}
.tab.active {
    background: rgba(0, 243, 255, 0.1);
    color: #00f3ff;
    box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
}

.input-group {
    margin-bottom: 1.5rem;
}
label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    color: #00f3ff;
    margin-bottom: 0.5rem;
    letter-spacing: 2px;
    text-transform: uppercase;
}
label::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background: #00f3ff;
    border-radius: 50%;
}
input[type=email], input[type=password], input[type=text] {
    width: 100%;
    padding: 1rem 1.25rem;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(0, 243, 255, 0.2);
    border-radius: 8px;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.3s;
}
input:focus {
    background: rgba(0, 0, 0, 0.6);
    border-color: #00f3ff;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
}

.btn-primary {
    width: 100%;
    padding: 1.25rem;
    background: #00f3ff;
    border: none;
    border-radius: 8px;
    color: #020617;
    font-size: 1rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.btn-primary:hover {
    background: #fff;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
    transform: translateY(-2px);
}
.btn-primary:active {
    transform: translateY(0);
}

.divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2rem 0;
    color: #444;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
}

.btn-google {
    width: 100%;
    padding: 1rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.btn-google:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
}

.error {
    background: rgba(255, 0, 60, 0.1);
    border-left: 4px solid #ff003c;
    color: #ff003c;
    padding: 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    margin-bottom: 1.5rem;
    display: none;
}

.demo-hint {
    margin-top: 2rem;
    padding: 1.25rem;
    background: rgba(0, 243, 255, 0.05);
    border: 1px dashed rgba(0, 243, 255, 0.3);
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #888;
    line-height: 1.8;
}
.demo-hint strong {
    color: #00f3ff;
}
</style>
</head>
<body>

<div class="cyber-grid"></div>

<div class="auth-container">
    <div class="logo-container">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        </div>
        <div class="logo-text">RiskChain<span>.AI</span></div>
    </div>
    <div class="subtitle">Secure Auth Terminal v2.0</div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Auth</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <div id="loginError" class="error"></div>
        <div class="input-group">
            <label>Agent Email</label>
            <input type="email" id="loginEmail" placeholder="agent@riskchain.ai" />
        </div>
        <div class="input-group">
            <label>Security Key</label>
            <input type="password" id="loginPassword" placeholder="••••••••••••" />
        </div>
        <button class="btn-primary" onclick="doLogin()">
            Initialize Link <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <div class="divider">External Provider</div>
        <a href="/accounts/google/login/" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.3 1.2 8.4 3.1l6.3-6.3C34.9 2.9 29.8 1 24 1 14.8 1 7 6.7 3.7 14.6l7.3 5.7C12.7 13.4 17.9 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8c4.4-4 7.2-9.9 7.2-17z"/><path fill="#FBBC05" d="M11 28.3c-.5-1.5-.8-3-.8-4.8s.3-3.3.8-4.8l-7.3-5.7C1.9 16.5 1 20.1 1 24s.9 7.5 2.7 10.8l7.3-5.5z"/><path fill="#34A853" d="M24 47c5.8 0 10.7-1.9 14.3-5.1l-7.5-5.8c-2 1.4-4.5 2.2-6.8 2.2-6.1 0-11.3-3.9-13-9.3l-7.3 5.5C7 41.3 14.8 47 24 47z"/></svg>
            Google Identity
        </a>
        <div class="demo-hint">
            [SYS_MSG] TEST CREDENTIALS:<br>
            USER: <strong>demo@riskchain.ai</strong><br>
            PASS: <strong>RiskChain2025!</strong>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none">
        <div id="regError" class="error"></div>
        <div class="input-group">
            <label>Agent Identifier</label>
            <input type="text" id="regName" placeholder="John Doe" />
        </div>
        <div class="input-group">
            <label>Agent Email</label>
            <input type="email" id="regEmail" placeholder="agent@company.com" />
        </div>
        <div class="input-group">
            <label>New Security Key</label>
            <input type="password" id="regPassword" placeholder="Strong Passcode" />
        </div>
        <button class="btn-primary" onclick="doRegister()">
            Generate Clearance <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <div class="divider">External Provider</div>
        <a href="/accounts/google/login/" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.3 1.2 8.4 3.1l6.3-6.3C34.9 2.9 29.8 1 24 1 14.8 1 7 6.7 3.7 14.6l7.3 5.7C12.7 13.4 17.9 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8c4.4-4 7.2-9.9 7.2-17z"/><path fill="#FBBC05" d="M11 28.3c-.5-1.5-.8-3-.8-4.8s.3-3.3.8-4.8l-7.3-5.7C1.9 16.5 1 20.1 1 24s.9 7.5 2.7 10.8l7.3-5.5z"/><path fill="#34A853" d="M24 47c5.8 0 10.7-1.9 14.3-5.1l-7.5-5.8c-2 1.4-4.5 2.2-6.8 2.2-6.1 0-11.3-3.9-13-9.3l-7.3 5.5C7 41.3 14.8 47 24 47z"/></svg>
            Google Identity
        </a>
    </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.getElementById('loginForm').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab==='register' ? 'block' : 'none';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent='[ERR] Missing parameters.'; errEl.style.display='block'; return; }
  try {
    const r = await fetch('/api/auth/login/', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password})});
    const d = await r.json();
    if (d.status === 'success') { window.location.href = '/'; }
    else { errEl.textContent = '[ERR] ' + (d.message || 'Invalid credentials.'); errEl.style.display='block'; }
  } catch(e) { errEl.textContent='[ERR] Connection refused by host.'; errEl.style.display='block'; }
}

async function doRegister() {
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const errEl = document.getElementById('regError');
  errEl.style.display = 'none';
  if (!name || !email || !password) { errEl.textContent='[ERR] Missing parameters.'; errEl.style.display='block'; return; }
  try {
    const r = await fetch('/api/auth/register/', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, email, password})});
    const d = await r.json();
    if (d.status === 'success') { window.location.href = '/'; }
    else { errEl.textContent = '[ERR] ' + (d.message || 'Registration failed.'); errEl.style.display='block'; }
  } catch(e) { errEl.textContent='[ERR] Connection refused by host.'; errEl.style.display='block'; }
}

document.addEventListener('keydown', e => { 
    if (e.key==='Enter') { 
        const lf=document.getElementById('loginForm'); 
        if(lf.style.display!=='none') doLogin(); 
        else doRegister(); 
    }
});
</script>
</body>
</html>
