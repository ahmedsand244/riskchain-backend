<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>RiskChain AI | Secure Terminal Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
}

html, body {
    width: 100%;
    min-height: 100%;
    background-color: #020617;
    color: #f8fafc;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body { 
    min-height: 100vh; 
    min-height: 100dvh;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: clamp(1rem, 4vw, 2.5rem) 1rem;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
}

/* Background Wrapper to isolate 3D grid and prevent mobile viewport blowout */
.bg-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    background-color: #020617;
    background-image: 
        radial-gradient(circle at 15% 40%, rgba(0, 243, 255, 0.12), transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(0, 119, 255, 0.12), transparent 40%);
}

.cyber-grid {
    position: absolute;
    top: -50%; 
    left: -50%; 
    width: 200%; 
    height: 200%;
    background-image: 
        linear-gradient(rgba(0, 243, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
    animation: gridMove 20s linear infinite;
}

@keyframes gridMove {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
}

/* Auth Card */
.auth-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 440px;
    margin: auto;
    padding: clamp(1.5rem, 5vw, 2.5rem);
    background: rgba(10, 15, 30, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 243, 255, 0.22);
    border-top: 3px solid #00f3ff;
    border-radius: 16px;
    box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(0, 243, 255, 0.12),
        inset 0 0 20px rgba(0, 243, 255, 0.04);
    box-sizing: border-box;
}

.logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 0.6rem;
}

.logo-icon {
    width: 46px;
    height: 46px;
    background: rgba(0, 243, 255, 0.1);
    border: 1.5px solid #00f3ff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    animation: pulse 2.5s infinite alternate ease-in-out;
    flex-shrink: 0;
}

.logo-icon svg {
    color: #00f3ff;
    width: 24px;
    height: 24px;
}

@keyframes pulse {
    0% { box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); transform: scale(0.98); }
    100% { box-shadow: 0 0 26px rgba(0, 243, 255, 0.55); transform: scale(1.02); }
}

.logo-text {
    font-size: clamp(1.4rem, 5.5vw, 1.85rem);
    font-weight: 900;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
}

.logo-text span {
    color: #00f3ff;
    text-shadow: 0 0 16px rgba(0, 243, 255, 0.5);
}

.subtitle {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(0.65rem, 2vw, 0.72rem);
    color: #94a3b8;
    letter-spacing: clamp(1.5px, 0.8vw, 3px);
    text-transform: uppercase;
    margin-bottom: 1.75rem;
}

.tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 1.75rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.tab {
    flex: 1;
    padding: 0.65rem 0.5rem;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.25s ease;
    border: none;
    background: transparent;
    color: #64748b;
}

.tab.active {
    background: rgba(0, 243, 255, 0.14);
    color: #00f3ff;
    box-shadow: inset 0 0 12px rgba(0, 243, 255, 0.25);
}

.input-group {
    margin-bottom: 1.25rem;
}

label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 700;
    color: #00f3ff;
    margin-bottom: 0.45rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

label::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #00f3ff;
    border-radius: 50%;
    box-shadow: 0 0 6px #00f3ff;
}

input[type=email], input[type=password], input[type=text] {
    width: 100%;
    padding: 0.85rem 1rem;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(0, 243, 255, 0.25);
    border-radius: 8px;
    color: #f8fafc;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: all 0.25s ease;
}

input:focus {
    background: rgba(0, 0, 0, 0.65);
    border-color: #00f3ff;
    box-shadow: 0 0 16px rgba(0, 243, 255, 0.25);
}

.btn-primary {
    width: 100%;
    padding: 0.95rem 1rem;
    background: #00f3ff;
    border: none;
    border-radius: 8px;
    color: #020617;
    font-size: 0.88rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
}

.btn-primary:hover {
    background: #ffffff;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
    transform: translateY(-2px);
}

.btn-primary:active {
    transform: translateY(0);
}

.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.4rem 0 1rem 0;
    color: #64748b;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
}

.btn-google {
    width: 100%;
    padding: 0.85rem 1rem;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #f8fafc;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
}

.btn-google:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(0, 243, 255, 0.4);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    transform: translateY(-1px);
}

.btn-google:active {
    transform: translateY(0);
}

.google-badge {
    font-size: 0.58rem;
    padding: 2px 6px;
    background: rgba(0, 243, 255, 0.15);
    border: 1px solid rgba(0, 243, 255, 0.4);
    color: #00f3ff;
    border-radius: 4px;
    letter-spacing: 0.5px;
    margin-left: 4px;
}

.error {
    background: rgba(255, 0, 60, 0.12);
    border-left: 3px solid #ff003c;
    color: #ff3366;
    padding: 0.75rem 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    margin-bottom: 1.25rem;
    border-radius: 0 6px 6px 0;
    display: none;
    word-break: break-word;
}

.demo-hint {
    margin-top: 1.4rem;
    padding: 0.9rem 1rem;
    background: rgba(0, 243, 255, 0.04);
    border: 1px dashed rgba(0, 243, 255, 0.3);
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: #94a3b8;
    line-height: 1.7;
    cursor: pointer;
    transition: all 0.2s ease;
}

.demo-hint:hover {
    background: rgba(0, 243, 255, 0.08);
    border-color: #00f3ff;
}

.demo-hint strong {
    color: #00f3ff;
    word-break: break-all;
}

.demo-click-hint {
    display: block;
    font-size: 0.62rem;
    color: #38bdf8;
    margin-top: 4px;
    opacity: 0.8;
}

/* Spinner */
.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(2, 6, 23, 0.3);
    border-radius: 50%;
    border-top-color: #020617;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="bg-wrapper">
    <div class="cyber-grid"></div>
</div>

<div class="auth-container">
    <div class="logo-container">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        </div>
        <div class="logo-text">RiskChain<span>.AI</span></div>
    </div>
    <div class="subtitle">Secure Auth Terminal v2.0</div>

    <div class="tabs">
        <button class="tab active" type="button" onclick="switchTab('login')">Auth</button>
        <button class="tab" type="button" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <div id="loginError" class="error"></div>
        <div class="input-group">
            <label>Agent Email</label>
            <input type="email" id="loginEmail" placeholder="agent@riskchain.ai" autocomplete="email" />
        </div>
        <div class="input-group">
            <label>Security Key</label>
            <input type="password" id="loginPassword" placeholder="••••••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-primary" id="loginBtn" onclick="doLogin()">
            <span>Initialize Link</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        
        <div class="divider">External Provider</div>
        
        <a href="/api/auth/google/" class="btn-google" id="googleBtn" title="Authenticate with Google Identity">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.3 1.2 8.4 3.1l6.3-6.3C34.9 2.9 29.8 1 24 1 14.8 1 7 6.7 3.7 14.6l7.3 5.7C12.7 13.4 17.9 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8c4.4-4 7.2-9.9 7.2-17z"/>
                <path fill="#FBBC05" d="M11 28.3c-.5-1.5-.8-3-.8-4.8s.3-3.3.8-4.8l-7.3-5.7C1.9 16.5 1 20.1 1 24s.9 7.5 2.7 10.8l7.3-5.5z"/>
                <path fill="#34A853" d="M24 47c5.8 0 10.7-1.9 14.3-5.1l-7.5-5.8c-2 1.4-4.5 2.2-6.8 2.2-6.1 0-11.3-3.9-13-9.3l-7.3 5.5C7 41.3 14.8 47 24 47z"/>
            </svg>
            <span>Google Identity</span>
            <span class="google-badge">ACTIVE</span>
        </a>

        <div class="demo-hint" onclick="fillDemoCredentials()" title="Click to auto-fill test credentials">
            [SYS_MSG] TEST CREDENTIALS:<br>
            USER: <strong>demo@riskchain.ai</strong><br>
            PASS: <strong>RiskChain2025!</strong>
            <span class="demo-click-hint">⚡ Click to auto-fill & login</span>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none">
        <div id="regError" class="error"></div>
        <div class="input-group">
            <label>Agent Identifier</label>
            <input type="text" id="regName" placeholder="John Doe" autocomplete="name" />
        </div>
        <div class="input-group">
            <label>Agent Email</label>
            <input type="email" id="regEmail" placeholder="agent@company.com" autocomplete="email" />
        </div>
        <div class="input-group">
            <label>New Security Key</label>
            <input type="password" id="regPassword" placeholder="Strong Passcode" autocomplete="new-password" />
        </div>
        <button class="btn-primary" id="regBtn" onclick="doRegister()">
            <span>Generate Clearance</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>

        <div class="divider">External Provider</div>

        <a href="/api/auth/google/" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.3 1.2 8.4 3.1l6.3-6.3C34.9 2.9 29.8 1 24 1 14.8 1 7 6.7 3.7 14.6l7.3 5.7C12.7 13.4 17.9 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8c4.4-4 7.2-9.9 7.2-17z"/>
                <path fill="#FBBC05" d="M11 28.3c-.5-1.5-.8-3-.8-4.8s.3-3.3.8-4.8l-7.3-5.7C1.9 16.5 1 20.1 1 24s.9 7.5 2.7 10.8l7.3-5.5z"/>
                <path fill="#34A853" d="M24 47c5.8 0 10.7-1.9 14.3-5.1l-7.5-5.8c-2 1.4-4.5 2.2-6.8 2.2-6.1 0-11.3-3.9-13-9.3l-7.3 5.5C7 41.3 14.8 47 24 47z"/>
            </svg>
            <span>Google Identity</span>
            <span class="google-badge">ACTIVE</span>
        </a>
    </div>
</div>

<script>
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    
    // Clear errors when switching
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('regError').style.display = 'none';
}

function fillDemoCredentials() {
    document.getElementById('loginEmail').value = 'demo@riskchain.ai';
    document.getElementById('loginPassword').value = 'RiskChain2025!';
    doLogin();
}

async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    
    errEl.style.display = 'none';
    if (!email || !password) { 
        errEl.textContent = '[ERR] Missing credentials. Enter email and security key.'; 
        errEl.style.display = 'block'; 
        return; 
    }
    
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> <span>AUTHENTICATING...</span>';
    
    try {
        const r = await fetch('/api/auth/login/', {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({email, password})
        });
        const d = await r.json();
        if (d.status === 'success') { 
            btn.innerHTML = '<span>ACCESS GRANTED ✓</span>';
            window.location.href = '/'; 
        } else { 
            errEl.textContent = '[ERR] ' + (d.message || 'Invalid credentials.'); 
            errEl.style.display = 'block'; 
            btn.disabled = false;
            btn.innerHTML = origHtml;
        }
    } catch(e) { 
        errEl.textContent = '[ERR] Connection failed or server offline.'; 
        errEl.style.display = 'block'; 
        btn.disabled = false;
        btn.innerHTML = origHtml;
    }
}

async function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const errEl = document.getElementById('regError');
    const btn = document.getElementById('regBtn');
    
    errEl.style.display = 'none';
    if (!name || !email || !password) { 
        errEl.textContent = '[ERR] All fields are mandatory for security clearance.'; 
        errEl.style.display = 'block'; 
        return; 
    }
    
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> <span>GENERATING...</span>';
    
    try {
        const r = await fetch('/api/auth/register/', {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({name, email, password})
        });
        const d = await r.json();
        if (d.status === 'success') { 
            btn.innerHTML = '<span>CLEARANCE ISSUED ✓</span>';
            window.location.href = '/'; 
        } else { 
            errEl.textContent = '[ERR] ' + (d.message || 'Registration failed.'); 
            errEl.style.display = 'block'; 
            btn.disabled = false;
            btn.innerHTML = origHtml;
        }
    } catch(e) { 
        errEl.textContent = '[ERR] Connection failed or server offline.'; 
        errEl.style.display = 'block'; 
        btn.disabled = false;
        btn.innerHTML = origHtml;
    }
}

document.addEventListener('keydown', e => { 
    if (e.key === 'Enter') { 
        const lf = document.getElementById('loginForm'); 
        if (lf.style.display !== 'none') doLogin(); 
        else doRegister(); 
    }
});
</script>
</body>
</html>
