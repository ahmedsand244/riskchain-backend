    <style>
        body {
            background-color: #0A1128; /* Deep Navy */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        body.light {
            background-color: #f0f4f8;
            color: #1a202c;
        }

        /* Dynamic Animated Background */
        .ai-grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }
        
        body.light .ai-grid-bg {
            background-image: 
                linear-gradient(to right, rgba(22, 66, 91, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(22, 66, 91, 0.25) 1px, transparent 1px);
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(50px) translateX(50px); }
        }

        .ai-glow {
            position: fixed;
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(0,243,255,0.08) 0%, rgba(10,17,40,0) 60%);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        body.light .ai-glow {
            background: radial-gradient(circle, rgba(0,243,255,0.2) 0%, rgba(255,255,255,0) 60%);
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Light Mode Text Fixes */
        body.light .text-gray-400, body.light .text-gray-300 { color: #4a5568 !important; }
        body.light .text-white { color: #1a202c !important; }
        body.light .text-cyber-cyan { color: #008996 !important; }
        body.light .border-glass-border { border-color: rgba(22, 66, 91, 0.1) !important; }
        body.light .hover\:text-white:hover { color: #000 !important; }

        .glass-panel {
            background: var(--glass-bg, rgba(10, 17, 40, 0.65));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border-color, rgba(0, 243, 255, 0.15));
            border-radius: 1.25rem;
            box-shadow: var(--glass-shadow, 0 8px 32px 0 rgba(0, 0, 0, 0.37));
            transition: all 0.3s ease;
        }
        
        body.light .glass-panel {
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border-color: rgba(22, 66, 91, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .input-field {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            width: 100%;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        body.light .input-field {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(22, 66, 91, 0.2);
            color: #1a202c;
        }

        .input-field:focus {
            outline: none;
            border-color: #00F3FF;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .select-field { background-color: rgba(10, 17, 40, 0.9); }
        body.light .select-field { background-color: #ffffff; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.6); }

        .game-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .game-cell { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(0, 243, 255, 0.1); }

        .cell-target { background: rgba(0, 255, 157, 0.2); border-color: rgba(0, 255, 157, 0.3); }
        .cell-path { background: rgba(255, 255, 255, 0.05); }
    </style>
</head>

        // --- Mini Game Component ---
        const SupplyChainSimulator = ({ t }) => {
            const [grid, setGrid] = useState([]);
            const [truckPos, setTruckPos] = useState({r:0, c:0});
            const [gameState, setGameState] = useState('playing'); // playing, won, lost
            const [logs, setLogs] = useState([]);

            const addLog = (msg, type='info') => {
                setLogs(prev => [...prev.slice(-4), { msg, type }]);
            };

            const initGame = useCallback(() => {
                const newGrid = Array(5).fill().map(() => Array(5).fill('path'));
                // Place obstacles
                let obstaclesPlaced = 0;
                while(obstaclesPlaced < 5) {
                    const r = Math.floor(Math.random() * 5);
                    const c = Math.floor(Math.random() * 4) + 1; // Don't place on start col
                    if((r!==4 || c!==4) && (r!==0 || c!==0) && newGrid[r][c] !== 'obstacle') {
                        newGrid[r][c] = 'obstacle';
                        obstaclesPlaced++;
                    }
                }
                newGrid[4][4] = 'target';
                setGrid(newGrid);
                setTruckPos({r:0, c:0});
                setGameState('playing');
                setLogs([{ msg: 'SYSTEM INITIALIZED. AWAITING ROUTING COMMANDS.', type: 'info' }]);
            }, []);

            useEffect(() => { initGame(); }, [initGame]);

            const moveTruck = () => {
                if(gameState !== 'playing') return;
                
                let nextR = truckPos.r;
                let nextC = truckPos.c;

                // Simple pathfinding
                if (nextC < 4 && grid[nextR][nextC+1] !== 'obstacle') {
                    nextC++;
                    addLog(`ROUTING VECTOR: [${nextR}, ${nextC}] - CLEAR`, 'success');
                } else if (nextR < 4 && grid[nextR+1][nextC] !== 'obstacle') {
                    nextR++;
                    addLog(`ROUTING VECTOR: [${nextR}, ${nextC}] - CLEAR`, 'success');
                } else {
                    setGameState('lost');
                    addLog(`CRITICAL FAILURE: NO VIABLE PATH DETECTED.`, 'error');
                    return;
                }

                setTruckPos({r: nextR, c: nextC});
                
                if (nextR === 4 && nextC === 4) {
                    setGameState('won');
                    addLog(`MISSION SUCCESS: DESTINATION REACHED.`, 'success');
                }
            };

            const clearObstacle = (r, c) => {
                if(grid[r][c] === 'obstacle' && gameState === 'playing') {
                    const newGrid = [...grid];
                    newGrid[r][c] = 'path';
                    setGrid(newGrid);
                    addLog(`MITIGATION DEPLOYED AT [${r}, ${c}]: OBSTACLE CLEARED.`, 'warning');
                }
            };

            return (
                <div className="max-w-6xl mx-auto animate-fade-in grid grid-cols-1 lg:grid-cols-12 gap-6">
                    
                    {/* Left: Tactical Console */}
                    <div className="lg:col-span-4 space-y-6">
                        <div className="glass-panel p-6 border-l-4 border-l-cyber-cyan h-full flex flex-col">
                            <h3 className="text-xl font-black mb-2 text-white flex items-center gap-2 uppercase tracking-widest border-b border-glass-border pb-4">
                                <IconActivity size={24} className="text-cyber-cyan" /> Fleet AI Router
                            </h3>
                            <p className="text-sm text-gray-400 mb-6 font-mono leading-relaxed">
                                You are in command of an autonomous logistics vessel. Click on red threat zones to clear them, then advance the AI vector to reach the destination matrix.
                            </p>

                setLoading(true);
                setProgress(10);

                        if (p >= 90) { clearInterval(interval); return 90; }
                        return p + 15;
                    });

                    header: true,

                            clearInterval(interval);
                            setProgress(100);
                            setTimeout(() => {
                                setResults(res.data.results);
                                setLoading(false);
                            }, 500);

                        {/* Desktop Navigation */}
                        <nav className="hidden md:flex items-center gap-6">
                            {Object.entries(t.nav).map(([key, val]) => (
                                <button key={key} onClick={() => setActiveTab(key)} 
                                    className={`text-sm font-medium transition-colors hover:text-cyber-cyan ${activeTab === key ? 'text-cyber-cyan border-b-2 border-cyber-cyan' : 'text-gray-400'}`}>
                                    {val}
                                </button>
                            ))}
                        </nav>

                        <div className="flex items-center gap-4">
                            {/* Notification Bell */}
                            {isStaff && (
                                <div className="relative">
                                    <button onClick={() => setShowNotifications(!showNotifications)} className="text-gray-400 hover:text-cyber-cyan transition-colors relative">
                                        <IconBell />
                                        {notifications.length > 0 && <span className="absolute -top-1 -right-1 w-3 h-3 bg-alert-red rounded-full animate-pulse border border-deep-navy"></span>}
                                    </button>
                                    {showNotifications && (
                                        <div className="absolute right-0 mt-2 w-80 glass-panel border border-glass-border shadow-cyan-glow p-4 z-50 animate-fade-in">
                                            <h4 className="text-sm font-bold text-cyber-cyan mb-2 border-b border-glass-border pb-2">Active Alerts</h4>
                                            {notifications.length === 0 ? <p className="text-xs text-gray-500">No new alerts.</p> : (
                                                <div className="space-y-3 max-h-64 overflow-y-auto">
                                                    {notifications.map(n => (
                                                        <div key={n.id} className="bg-alert-red/10 border border-alert-red/30 p-2 rounded text-left" dir={lang==='ar'?'rtl':'ltr'}>
                                                            <p className="text-xs text-white">{lang === 'ar' ? n.message_ar : n.message_en}</p>
                                                            <span className="text-[10px] text-gray-400">{n.created_at}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            <button onClick={toggleLang} className="text-xs font-mono border border-glass-border px-2 py-1 rounded hover:bg-glass-light transition-colors">
                                {lang === 'en' ? 'عربي' : 'EN'}
                            </button>
                            <button onClick={toggleTheme} className="text-gray-400 hover:text-cyber-cyan transition-colors">
                                {theme === 'dark' ? <IconSun /> : <IconMoon />}
                            </button>
                            <button onClick={() => { fetch('/api/auth/logout/', {method:'POST'}); window.location.href = '/login/'; }} 
                                className="flex items-center gap-2 text-sm text-alert-red border border-alert-red/30 px-3 py-1.5 rounded-lg hover:bg-alert-red hover:text-white transition-all">
                                <IconLogOut /> <span className="hidden md:inline">{t.header.logout}</span>
                            </button>
                        </div>
                    </header>

                    {/* Mobile Navigation (Simple) */}
                    <nav className="md:hidden flex overflow-x-auto gap-4 p-4 glass-panel !rounded-none !border-x-0 !border-t-0 scrollbar-hide">
                        {Object.entries(t.nav).map(([key, val]) => (
                            <button key={key} onClick={() => setActiveTab(key)} className={`text-xs whitespace-nowrap px-3 py-1.5 rounded-full ${activeTab === key ? 'bg-cyber-cyan text-deep-navy font-bold' : 'bg-glass-light text-gray-300'}`}>
                                {val}
                            </button>
                        ))}
                    </nav>

                    {/* Main Content Area */}
                    <main className="container mx-auto px-4 py-8 max-w-7xl relative z-10">
                        {renderContent()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endverbatim %}
</body>
</html>
